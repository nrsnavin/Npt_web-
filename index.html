<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NPT Hangers — CRM &amp; ERP</title>
    <!-- Every page load asked for /favicon.ico, got nothing, and logged a 404 in the console of
         a tab whose icon was blank. One file fixes both. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable: the manifest names the app and its icons; iOS reads its own tags. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Navin Hangers" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#0C141A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F0F4F7" media="(prefers-color-scheme: light)" />
    <!-- Applies the stored theme before the first paint. Its own file, not an inline script, so
         the page can be served with a Content-Security-Policy that allows no inline script. -->
    <script src="/theme.js"></script>
    <meta
      name="description"
      content="Navin Hangers CRM and ERP — sales, production, inventory and accounts in one console."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
