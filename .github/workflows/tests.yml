name: Web checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The button on the Actions tab. A box that was down when something merged needs a way to
  # catch up that is not "commit something to trigger a deploy".
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Errors only. The build does not catch an undefined variable — Vite treats an unknown
      # identifier as a global it cannot see yet — so a name left behind by a refactor ships and
      # throws in front of somebody. That is exactly how lead conversion broke: `mould` was
      # removed from the form, one reference stayed, and every conversion with an enquiry threw.
      # The 60-odd unused-variable warnings are dead code, not failures, and stay warnings.
      - run: npx eslint src --quiet
      - run: npm test
      - run: npm run build

  # ---------------------------------------------------------------------------
  # Build it on the box, once the checks above have gone green [DEPLOY-AWS.md §11].
  #
  # The checks already ran `npm run build` on GitHub, which proves the build *works*. It cannot
  # produce the artefact this box needs: `VITE_API_URL` is baked in at build time and lives only
  # in `.env.production` on the server, so the build that gets served has to happen there.
  #
  # Separate from the API's deploy on purpose. A change to the web repo has no business
  # reloading the API, and the two are almost never released together.
  # ---------------------------------------------------------------------------
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, npt]
    timeout-minutes: 15
    # A Vite build on a 2 GB box with MongoDB beside it is the heaviest thing that happens here.
    # Two at once is what the swap file was protecting against, and cancelling one mid-rename is
    # how `dist` ends up missing.
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: bash deploy/on-box.sh
